<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0D1B2A"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="200" ry="200" fill="url(#bg)"/>

  <!-- Steering wheel ring -->
  <circle cx="512" cy="512" r="330" fill="none" stroke="white" stroke-width="68"/>

  <!-- Spokes: top, bottom-left (210 deg), bottom-right (330 deg) -->
  <line x1="512" y1="424" x2="512" y2="182" stroke="white" stroke-width="60"/>
  <line x1="434" y1="556" x2="226" y2="676" stroke="white" stroke-width="60"/>
  <line x1="590" y1="556" x2="798" y2="676" stroke="white" stroke-width="60"/>

  <!-- Hub -->
  <circle cx="512" cy="512" r="88" fill="white"/>

  <!-- Conductor wand: dark shadow then amber highlight -->
  <line x1="155" y1="865" x2="785" y2="168"
        stroke="#7B3A18" stroke-width="26" stroke-linecap="round"/>
  <line x1="155" y1="865" x2="785" y2="168"
        stroke="#D4873C" stroke-width="15" stroke-linecap="round"/>

  <!-- Wand tip glow + ball -->
  <circle cx="785" cy="168" r="42" fill="white" opacity="0.18" filter="url(#glow)"/>
  <circle cx="785" cy="168" r="28" fill="white"/>

  <!-- Motion arcs: three concentric whoosh lines suggesting sweep -->
  <path d="M 742 142 Q 772 102 808 118"
        fill="none" stroke="white" stroke-width="13" stroke-linecap="round" opacity="0.80"/>
  <path d="M 738 108 Q 778 58 822 80"
        fill="none" stroke="white" stroke-width="9"  stroke-linecap="round" opacity="0.52"/>
  <path d="M 734 74  Q 782 14 836 42"
        fill="none" stroke="white" stroke-width="6"  stroke-linecap="round" opacity="0.28"/>
</svg>
